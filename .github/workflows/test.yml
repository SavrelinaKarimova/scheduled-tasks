name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          if [ -z "$OWM_API_KEY" ] || [ -z "$ACCOUNT_SID" ] || [ -z "$AUTH_TOKEN" ]; then
            echo "Error: One or more weather/Twilio secrets are missing!"
            exit 1
          else
            echo "All required secrets (OWM and Twilio) are configured!"
          fi

      - name: Check required files exist
        run: |
          if [ -f "main.py" ] && [ -f "requirements.txt" ]; then
            echo "Required files (main.py, requirements.txt) found!"
          else
            echo "Error: Critical files missing!"
            exit 1
          fi

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo "========================================"
          echo "  All weather app checks passed!"
          echo "========================================"
